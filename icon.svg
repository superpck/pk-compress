<!-- PK Compress Logo - Minimalist Green/Teal Design -->
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient definition -->
    <linearGradient id="pkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="110" fill="url(#pkGradient)"/>
  
  <!-- Compressed folder icon -->
  <g transform="translate(256, 256)" filter="url(#shadow)">
    <!-- Folder base -->
    <path d="M -140,-80 L -140,100 L 140,100 L 140,-40 L 40,-40 L 20,-80 Z" 
          fill="rgba(255,255,255,0.95)" 
          stroke="rgba(255,255,255,0.3)" 
          stroke-width="2"/>
    
    <!-- Compression arrows (down arrow on left) -->
    <g transform="translate(-70, 0)">
      <!-- Arrow shaft -->
      <rect x="-8" y="-30" width="16" height="40" fill="rgba(16,185,129,0.8)" rx="3"/>
      <!-- Arrow head -->
      <path d="M 0,20 L -20,0 L -10,0 L -10,-10 L 10,-10 L 10,0 L 20,0 Z" 
            fill="rgba(16,185,129,0.8)"/>
    </g>
    
    <!-- Compression arrows (up arrow on right) -->
    <g transform="translate(70, 10)">
      <!-- Arrow shaft -->
      <rect x="-8" y="-10" width="16" height="40" fill="rgba(6,182,212,0.8)" rx="3"/>
      <!-- Arrow head -->
      <path d="M 0,-20 L -20,0 L -10,0 L -10,10 L 10,10 L 10,0 L 20,0 Z" 
            fill="rgba(6,182,212,0.8)"/>
    </g>
  </g>
  
  <!-- PK Text Badge -->
  <g transform="translate(256, 380)">
    <!-- Badge background -->
    <rect x="-60" y="-28" width="120" height="56" rx="28" 
          fill="rgba(255,255,255,0.95)" 
          filter="url(#shadow)"/>
    
    <!-- PK Text -->
    <text x="0" y="12" 
          font-family="SF Pro Display, -apple-system, system-ui, sans-serif" 
          font-size="42" 
          font-weight="800" 
          text-anchor="middle" 
          fill="url(#pkGradient)">PK</text>
  </g>
</svg>
